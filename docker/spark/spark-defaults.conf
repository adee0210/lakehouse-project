# ---------------------------------------------------------------------------
# Iceberg catalog "lakehouse" (JDBC catalog lưu metadata trên Postgres,
# data/metadata file lưu trên MinIO qua S3FileIO). Giá trị ${...} được
# entrypoint.sh thay bằng biến môi trường lúc khởi động.
# ---------------------------------------------------------------------------
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalogImplementation               in-memory
spark.sql.defaultCatalog                      lakehouse
spark.sql.catalog.lakehouse                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl      org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lakehouse.uri               jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.lakehouse.jdbc.user         __PG_USER__
spark.sql.catalog.lakehouse.jdbc.password     __PG_PASSWORD__
spark.sql.catalog.lakehouse.jdbc.schema-version V1
spark.sql.catalog.lakehouse.warehouse         s3://warehouse
spark.sql.catalog.lakehouse.io-impl           org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint       http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.s3.access-key-id  __S3_KEY__
spark.sql.catalog.lakehouse.s3.secret-access-key __S3_SECRET__
spark.sql.catalog.lakehouse.client.region     us-east-1

# Ngữ nghĩa SQL gần Oracle: không ANSI để TO_DATE lỗi -> NULL thay vì exception
spark.sql.ansi.enabled                        false
spark.sql.session.timeZone                    Asia/Ho_Chi_Minh
spark.sql.shuffle.partitions                  8
spark.sql.adaptive.enabled                    true
spark.sql.legacy.timeParserPolicy             CORRECTED
spark.driver.memory                           1600m
spark.ui.showConsoleProgress                  false
spark.eventLog.enabled                        false

# Mọi session Thrift (dbt threads, Airflow tasks) dùng chung 1 SparkSession/catalog
# -> tránh mỗi session mở 1 pool JDBC mới tới Postgres (lỗi "too many clients").
spark.sql.hive.thriftServer.singleSession     true
spark.sql.catalog.lakehouse.clients           4

# Thrift server chạy lâu dài: giới hạn lịch sử UI/listener để driver không OOM
# (mỗi dbt run sinh ~1000 câu lệnh: CTAS/MERGE + ALTER COLUMN COMMENT)
spark.ui.retainedJobs                         50
spark.ui.retainedStages                       50
spark.ui.retainedTasks                        2000
spark.sql.ui.retainedExecutions               20
spark.sql.thriftServer.ui.retainedStatements  20
spark.sql.thriftServer.ui.retainedSessions    20
spark.cleaner.periodicGC.interval             5min
spark.driver.extraJavaOptions                 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError

# Local mode: executor dùng chung heap driver -> hạn chế broadcast join & bộ nhớ thực thi đồng thời
spark.sql.autoBroadcastJoinThreshold          4194304
spark.memory.fraction                         0.5
spark.sql.files.maxPartitionBytes             33554432

# Tắt constraint propagation của Catalyst: với nhiều cột alias từ biểu thức CASE/regexp (macro t24_date)
# + UNION ALL/OR-join (SCD2), bước suy diễn ràng buộc tăng theo cấp số nhân -> driver OOM ở pha optimize.
spark.sql.constraintPropagation.enabled       false
