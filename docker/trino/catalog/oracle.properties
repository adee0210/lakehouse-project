# Nguồn Oracle (qua VPN) – để đối chiếu nguồn PG_* với tầng Bronze ngay trên Trino
connector.name=oracle
connection-url=jdbc:oracle:thin:@//${ENV:ORACLE_HOST}:${ENV:ORACLE_PORT}/${ENV:ORACLE_SERVICE}
connection-user=${ENV:ORACLE_USER}
connection-password=${ENV:ORACLE_PASSWORD}
oracle.number.default-scale=5
oracle.number.rounding-mode=HALF_UP
oracle.remarks-reporting.enabled=false
