version: 2

models:
  - name: loan_ar
    description: "PG_SILVER.LOAN_AR – sheet 'Loan Arrangement'"
    data_tests:
      - column_contract:
          expected: [SRC_STM_CODE, AR_ID, AR_CODE, FCC_AR_CODE, ORIG_AMT_FCY, CHKER_OFCR_CODE, PD_CGY_CODE, FRST_OU_CODE, PPR_CTR_NBR, CCY_CODE, CST_CODE, CST_ID, DSBR_AMT_FCY, EXG_RATE_TO_LCL_CCY, FCC_LMT_CODE, MAT_DT, MAKER_OFCR_CODE, LMT_CODE, LMT_ID, TERM_CODE, LOS_CTR_NBR, REFRRER_OFCR_CODE, VAL_DT, PD_CODE, AR_PPS_TP_CODE, AR_PPS_GRP_CODE, EFF_DT, FCC_VAL_DT, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
      - unique_key:
          columns: [AR_ID, SYS_EFF_DT]
      - scd2_single_current:
          columns: [AR_ID]
      - scd2_valid_period
    columns:
      - name: src_stm_code
        description: "Mã hệ thống nguồn dữ liệu"
      - name: ar_id
        description: "Unique key trên DWH"
        data_tests:
          - is_md5
      - name: ar_code
        description: "Mã hợp đồng"
      - name: fcc_ar_code
        description: "Mã hợp đồng FlexCube"
      - name: orig_amt_fcy
        description: "Giá trị phê duyệt"
      - name: chker_ofcr_code
        description: "Mã người phê duyệt"
      - name: pd_cgy_code
        description: "Mã phân loại sản phẩm"
      - name: frst_ou_code
        description: "Mã chi nhánh quản lý đầu tiên"
      - name: ppr_ctr_nbr
        description: "Mã hồ sơ"
      - name: ccy_code
        description: "Loại tiền"
      - name: cst_code
        description: "Mã khách hàng"
      - name: cst_id
        description: "Mã khách hàng"
        data_tests:
          - is_md5
          - hash_match_rate:
              to: "ref('cst')"
              field: CST_ID
              where: "SYS_EXP_DT is null"
              to_where: "SYS_EXP_DT is null"
              config:
                severity: warn
      - name: dsbr_amt_fcy
        description: "Số tiền thực tế giải ngân"
      - name: exg_rate_to_lcl_ccy
        description: "Tỷ giá quy đổi"
      - name: fcc_lmt_code
        description: "Mã hạn mức trên Flexcube"
      - name: mat_dt
        description: "Ngày đáo hạn hợp đồng"
      - name: maker_ofcr_code
        description: "ID người nhập liệu"
      - name: lmt_code
        description: "Mã tham chiếu hạn mức"
      - name: lmt_id
        description: "Mã tham chiếu hạn mức"
        data_tests:
          - is_md5
      - name: term_code
        description: "Kỳ hạn"
      - name: los_ctr_nbr
        description: "Số hồ sơ"
      - name: refrrer_ofcr_code
        description: "ID nhân viên giới thiệu"
      - name: val_dt
        description: "Ngày hiệu lực đầu tiên của hợp đồng"
      - name: pd_code
        description: "Mã nhóm sản phẩm"
      - name: ar_pps_tp_code
        description: "Mã mục đích vay"
      - name: ar_pps_grp_code
        description: "Mã nhóm mục đích vay"
      - name: eff_dt
        description: "Ngày hiệu lực hợp đồng"
      - name: fcc_val_dt
        description: "Ngày ghi nhận"
      - name: sys_eff_dt
        description: "Ngày bản ghi lần đầu tiên vào hệ thống"
      - name: sys_exp_dt
        description: "Ngày hết hạn của bản ghi"
      - name: sys_udt_dt
        description: "Ngày update dữ liệu gần nhất"
