version: 2

models:
  - name: ar_avy_shd_itm
    description: "PG_SILVER.AR_AVY_SHD_ITM – sheet 'Arrangement Activity Schedule I'"
    data_tests:
      - column_contract:
          expected: [AR_AVY_SHD_ID, AR_AVY_SHD_CODE, AR_AVY_SHD_TP, AR_ID, AR_CODE, PBL_AMT_TP, PBL_AMT_LCY, PBL_AMT_FCY, EXG_RATE, CCY_CODE, EFF_MAT_DT, F_LAST_OD_DT, LAST_OD_DT, SRC_STM_CODE, CST_ID, CST_CODE, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
      - unique_key:
          columns: [AR_AVY_SHD_ID, SYS_EFF_DT]
      - scd2_single_current:
          columns: [AR_AVY_SHD_ID]
      - scd2_valid_period
    columns:
      - name: ar_avy_shd_id
        description: "ID duy nhất của mã số dòng lịch  trên DWH"
        data_tests:
          - is_md5
      - name: ar_avy_shd_code
        description: "Mã số dòng lịch trên hệ thống nguồn"
      - name: ar_avy_shd_tp
        description: "Phân loại của dòng lịch hợp đồng"
      - name: ar_id
        description: "ID duy nhất của hợp đồng trên DWH"
        data_tests:
          - is_md5
      - name: ar_code
        description: "Mã của hợp đồng gốc"
      - name: pbl_amt_tp
        description: "Phân loại tiền cần thanh toán trong kỳ bill tương ứng (PS/PE/LD,..)"
      - name: pbl_amt_lcy
        description: "Số tiền cần thanh toán quy đổi trong kỳ bill tương ứng"
      - name: pbl_amt_fcy
        description: "Số tiền cần thanh toán nguyên tệ trong kỳ bill tương ứng"
      - name: exg_rate
        description: "Tỷ giá thực hiện"
      - name: ccy_code
        description: "Mã loại tiền"
      - name: eff_mat_dt
        description: "Ngày hiệu lực của dòng lịch"
      - name: f_last_od_dt
        description: "Cờ hợp đồng có đang tồn tại kỳ trả nợ quá hạn gần nhất hay không"
      - name: last_od_dt
        description: "Ngày đến hạn của kỳ trả nợ gần nhất đã chuyển sang quá hạn"
      - name: src_stm_code
        description: "Mã nguồn dữ liệu"
      - name: cst_id
        description: "ID duy nhất của khách hàng liên quan trên DWH"
        data_tests:
          - is_md5
      - name: cst_code
        description: "Mã số khách hàng"
      - name: sys_eff_dt
        description: "Ngày bản ghi lần đầu tiên vào hệ thống"
      - name: sys_exp_dt
        description: "Ngày hết hạn của bản ghi"
      - name: sys_udt_dt
        description: "Ngày update dữ liệu gần nhất"
