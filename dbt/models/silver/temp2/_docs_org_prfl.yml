      - name: vip_tp_code
        description: "Phân hạng khách hàng ưu tiên (VIP)"
      - name: vip_eff_dt
        description: "Ngày hiệu lực phân hạng khách hàng VIP"
      - name: kyc_cnl_code
        description: "Kênh thực hiện KYC"
      - name: gen_dir_plc
