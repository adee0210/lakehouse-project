        description: "Cờ kiểm tra phòng chống rửa tiền (AML)"
      - name: mb_cr_st
        description: "Trạng thái quan hệ tín dụng MB"
      - name: sys_eff_dt
        description: "Ngày bản ghi lần đầu tiên vào hệ thống"
      - name: sys_exp_dt
        description: "Ngày hết hạn của bản ghi"
      - name: sys_udt_dt
