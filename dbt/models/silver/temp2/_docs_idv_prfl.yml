version: 2

models:
  - name: idv_prfl
    description: "PG_SILVER.IDV_PRFL – sheet 'Individual Profile'"
    data_tests:
      - column_contract:
          expected: [CST_ID, CST_CODE, CST_LCS_CODE, AML_CHK_F, AML_RSLT, CST_FNC_ST_CODE, OU_CODE, CST_ST_CODE, INN_BNKG_F, KYC_CNL_CODE, VSS_CODE, MBL_BNKG_F, CTY_OF_CTZN_CODE, JNT_LBY_F, TAX_IDENTN_NBR, VIP_F, GND, IDY_LV1_CL_CODE, IDY_LV2_CL_CODE, DOB, VIP_TP_CODE, VIP_EFF_DT, BSN_RGST_EFF_DT, MB_CR_ST, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
