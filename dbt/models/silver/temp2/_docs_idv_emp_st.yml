version: 2

models:
  - name: idv_emp_st
    description: "PG_SILVER.IDV_EMP_ST – sheet 'Individual Employment Status'"
    data_tests:
      - column_contract:
          expected: [CST_ID, CST_CODE, IDV_EMP_ST_CODE, ANUL_INCM, OCP_CODE, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
      - unique_key:
          columns: [CST_ID, SYS_EFF_DT]
      - scd2_single_current:
          columns: [CST_ID]
      - scd2_valid_period
    columns:
      - name: cst_id
        description: "Unique key trên DWH"
        data_tests:
          - is_md5
      - name: cst_code
        description: "Mã CIF"
      - name: idv_emp_st_code
        description: "Trạng thái khách hàng"
      - name: anul_incm
        description: "Thu nhập theo tháng"
      - name: ocp_code
        description: "Nghề nghiệp của khách hàng"
      - name: sys_eff_dt
        description: "Ngày bản ghi lần đầu tiên vào hệ thống"
      - name: sys_exp_dt
        description: "Ngày hết hạn của bản ghi"
      - name: sys_udt_dt
        description: "Ngày update dữ liệu gần nhất"
