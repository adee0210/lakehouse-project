version: 2

models:
  - name: ccy
    description: "PG_SILVER.CCY – sheet 'Currency'"
    data_tests:
      - column_contract:
          expected: [CCY_ID, CCY_CODE, CCY_NM, NUMERIC_CCY_CODE, SRC_STM_CODE, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
      - unique_key:
          columns: [CCY_ID]
    columns:
      - name: ccy_id
        description: "Mã duy nhất của loại tiền trên DWH"
        data_tests:
          - is_md5
      - name: ccy_code
        description: "Mã loại tiền"
      - name: ccy_nm
        description: "Tên loại tiền"
      - name: numeric_ccy_code
        description: "Mã tiền tệ dạng số"
      - name: src_stm_code
        description: "Mã nguồn dữ liệu"
      - name: sys_eff_dt
        description: "Ngày bản ghi lần đầu tiên vào hệ thống"
      - name: sys_exp_dt
        description: "Ngày hết hạn của bản ghi"
      - name: sys_udt_dt
        description: "Ngày update dữ liệu gần nhất"
