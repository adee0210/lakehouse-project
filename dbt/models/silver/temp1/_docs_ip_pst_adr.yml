version: 2

models:
  - name: ip_pst_adr
    description: "PG_SILVER.IP_PST_ADR – sheet 'Involved Party Postal Address'"
    data_tests:
      - column_contract:
          expected: [CST_ID, CST_CODE, PST_ADR_TP, PST_ADR_VAL, CTY_NM, PROV_NM, STR_NM, SYS_EFF_DT, SYS_EXP_DT, SYS_UDT_DT]
      - unique_key:
          columns: [CST_ID, PST_ADR_TP, SYS_EFF_DT]
      - scd2_single_current:
          columns: [CST_ID, PST_ADR_TP]
      - scd2_valid_period
    columns:
      - name: cst_id
        description: "Unique key khách hàng trên DWH"
        data_tests:
          - is_md5
      - name: cst_code
        description: "Mã khách hàng (CIF)"
      - name: pst_adr_tp
        description: "Loại địa chỉ bưu chính"
      - name: pst_adr_val
        description: "Địa chỉ cư trú hiện tại đầy đủ"
      - name: cty_nm
        description: "Tên quốc gia cư trú hiện tại"
      - name: prov_nm
        description: "Tên tỉnh/thành phố cư trú hiện tại"
      - name: str_nm
        description: "Số nhà, tên đường cư trú hiện tại"
      - name: sys_eff_dt
        description: "Ngày hiệu lực bản ghi SCD2"
      - name: sys_exp_dt
        description: "Ngày hết hiệu lực bản ghi SCD2"
      - name: sys_udt_dt
        description: "Ngày cập nhật bản ghi"
