version: 2

models:
  - name: dim_ou
    description: "PG_GOLD.DIM_OU – sheet 'Dimension Organization Unit'"
    data_tests:
      - column_contract:
          expected: [DIM_KEY, OU_ID, OU_CODE, OU_NM, SYS_EFF_DT, SYS_EXP_DT]
      - unique_key:
          columns: [DIM_KEY]
      - scd2_single_current:
          columns: [OU_ID]
    columns:
      - name: dim_key
        description: "Key của bảng"
      - name: ou_id
        description: "ID của chi nhánh"
        data_tests:
          - is_md5
      - name: ou_code
        description: "Mã chi nhánh"
      - name: ou_nm
        description: "Tên chi nhánh"
      - name: sys_eff_dt
        description: "Ngày hiệu lực bản ghi"
      - name: sys_exp_dt
        description: "Ngày hết hiệu lực bản ghi"
