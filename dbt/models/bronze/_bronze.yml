version: 2

sources:
  - name: ebanking
    description: Hệ thống nguồn EBANKING (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_ebanking' if var('source_mode', 'mock') == 'oracle' else 'src_ebanking' }}"
    tables:
      - name: col_udf_value
        description: "EBANKING.COL_UDF_VALUE@PGDB"
  - name: flexbo
    description: Hệ thống nguồn FLEXBO (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_flexbo' if var('source_mode', 'mock') == 'oracle' else 'src_flexbo' }}"
    tables:
      - name: pgbld_contract_udfield_hist
        description: "FLEXBO.PGBLD_CONTRACT_UDFIELD_HIST"
      - name: pgbld_rt_contract_udfield_hist
        description: "FLEXBO.PGBLD_RT_CONTRACT_UDFIELD_HIST"
      - name: pgb_contract_udf_map
        description: "FLEXBO.PGB_CONTRACT_UDF_MAP"
      - name: pgb_ldtb_contract_master
        description: "FLEXBO.PGB_LDTB_CONTRACT_MASTER"
      - name: pgb_los_contract_fields_tdate
        description: "FLEXBO.PGB_LOS_CONTRACT_FIELDS_TDATE"
  - name: los_app
    description: Hệ thống nguồn LOS_APP (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_los_app' if var('source_mode', 'mock') == 'oracle' else 'src_los_app' }}"
    tables:
      - name: facility
        description: "LOS_APP.FACILITY@TO_LOS"
      - name: loan_disbursement
        description: "LOS_APP.LOAN_DISBURSEMENT@TO_LOS"
      - name: product
        description: "LOS_APP.PRODUCT@TO_LOS"
  - name: smy
    description: Hệ thống nguồn SMY (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_smy' if var('source_mode', 'mock') == 'oracle' else 'src_smy' }}"
    tables:
      - name: stmt_daily
        description: "SMY.STMT_DAILY"
  - name: source
    description: Hệ thống nguồn SOURCE (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_source' if var('source_mode', 'mock') == 'oracle' else 'src_source' }}"
    tables:
      - name: saoke_crb
        description: "SOURCE.SAOKE_CRB"
      - name: saoke_mvmt
        description: "SOURCE.SAOKE_MVMT"
  - name: t24core
    description: Hệ thống nguồn T24CORE (Oracle) – mock/oracle tuỳ var source_mode
    schema: "{{ 'spark_catalog.ora_t24core' if var('source_mode', 'mock') == 'oracle' else 'src_t24core' }}"
    tables:
      - name: company
        description: "T24CORE.COMPANY"
      - name: currency
        description: "T24CORE.CURRENCY"
      - name: currency_his
        description: "T24CORE.CURRENCY_HIS"
      - name: customer
        description: "T24CORE.CUSTOMER"
      - name: dept_acct_officer
        description: "T24CORE.DEPT_ACCT_OFFICER"
      - name: ld_loans_and_deposits
        description: "T24CORE.LD_LOANS_AND_DEPOSITS"
      - name: ld_loans_and_deposits_his
        description: "T24CORE.LD_LOANS_AND_DEPOSITS_HIS"
      - name: ld_schedule_define_mv
        description: "T24CORE.LD_SCHEDULE_DEFINE_MV"
      - name: limit
        description: "T24CORE.LIMIT"
      - name: mb_mg_saving_multi
        description: "T24CORE.MB_MG_SAVING_MULTI"
      - name: pd_payment_due
        description: "T24CORE.PD_PAYMENT_DUE"
      - name: pd_payment_due_his
        description: "T24CORE.PD_PAYMENT_DUE_HIS"
      - name: pd_payment_due_his_mv
        description: "T24CORE.PD_PAYMENT_DUE_HIS_MV"
      - name: pd_payment_due_mv
        description: "T24CORE.PD_PAYMENT_DUE_MV"
      - name: sector
        description: "T24CORE.SECTOR"
      - name: stmt_entry
        description: "T24CORE.STMT_ENTRY"

