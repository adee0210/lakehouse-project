lakehouse:
  target: dev
  outputs:
    dev:
      type: spark
      method: thrift
      host: "{{ env_var('DBT_SPARK_HOST', 'localhost') }}"
      port: 10000
      schema: default
      auth: NOSASL
      user: dbt
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
      connect_retries: 10
      connect_timeout: 60
      retry_all: true
