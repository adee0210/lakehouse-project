name: training-lakehouse

# =============================================================================
# Local Lakehouse: Source (Oracle | mock) -> Bronze -> Silver -> Gold
#   MinIO (object storage, dữ liệu lưu tại ./data/minio trên máy local)
#   Postgres (Airflow metadata + Iceberg JDBC catalog)
#   Spark Thrift Server (Spark 3.5 + Iceberg 1.6) = SQL engine cho dbt-spark
#   dbt (dbt-spark 1.9, chạy 68 model theo BA)
#   Airflow (profile "airflow") orchestration theo sheet Job_dependence
# =============================================================================

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=64MB"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks: [lakehouse-net]

  minio:
    image: bitnamilegacy/minio:2024.4.18
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: warehouse,source,bronze,silver,gold
      GOGC: "50"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    networks: [lakehouse-net]

  spark-thrift:
    build: ./docker/spark
    image: training-lakehouse/spark-iceberg:3.5.3-1.6.1
    environment:
      <<: *common-env
      SPARK_CORES: ${SPARK_CORES:-4}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1600m}
      AWS_REGION: us-east-1
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "10000:10000"
      - "4040:4040"
    volumes:
      - ./data/mock_source:/data/mock_source
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2300m
    restart: unless-stopped
    networks: [lakehouse-net]

  dbt:
    image: ghcr.io/dbt-labs/dbt-spark:1.9.0
    working_dir: /usr/app/dbt
    environment:
      <<: *common-env
      DBT_PROFILES_DIR: /usr/app/dbt
      DBT_SPARK_HOST: spark-thrift
      ORACLE_HOST: ${ORACLE_HOST}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE: ${ORACLE_SERVICE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      - ./dbt:/usr/app/dbt
      - ./scripts:/usr/app/scripts
      - ./data/mock_source:/data/mock_source
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    ports:
      - "8082:8082"   # dbt docs (lineage 74 model): bash scripts/dbt_docs.sh
    depends_on:
      spark-thrift: { condition: service_healthy }
    mem_limit: 384m
    networks: [lakehouse-net]

  # ---------------------------------------------------------------- Airflow --
  airflow-init:
    profiles: ["airflow"]
    build: ./docker/airflow
    image: training-lakehouse/airflow-dbt:2.10.4
    environment: &airflow-env
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_SPARK_HOST: spark-thrift
      SOURCE_MODE: ${SOURCE_MODE:-oracle}
      ORACLE_HOST: ${ORACLE_HOST}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE: ${ORACLE_SERVICE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    command: >
      bash -c "airflow db migrate && airflow users create --username ${POSTGRES_USER} --password ${POSTGRES_PASSWORD}
      --firstname Local --lastname Admin --role Admin --email admin@example.local || true"
    depends_on:
      postgres: { condition: service_healthy }
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
      - ./data/mock_source:/data/mock_source
    networks: [lakehouse-net]

  airflow:
    profiles: ["airflow"]
    image: training-lakehouse/airflow-dbt:2.10.4
    environment: *airflow-env
    # webserver + scheduler trong 1 container để tiết kiệm RAM
    command: bash -c "airflow scheduler & exec airflow webserver"
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      spark-thrift: { condition: service_healthy }
    ports:
      - "8081:8080"
    volumes: *airflow-volumes
    mem_limit: 1200m
    networks: [lakehouse-net]

  # ------------------------------------------------------ UI / Query (profile "ui") --
  # Trino đọc CHUNG Iceberg catalog (JDBC trên Postgres) với Spark -> query Bronze/Silver/Gold
  # + catalog "oracle" đọc thẳng nguồn PG_* để đối chiếu. Web UI theo dõi query: http://localhost:8080
  trino:
    profiles: ["ui"]
    image: trinodb/trino:467
    environment:
      <<: *common-env
      ORACLE_HOST: ${ORACLE_HOST}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE: ${ORACLE_SERVICE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'select 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    mem_limit: 1400m
    networks: [lakehouse-net]

  # CloudBeaver: SQL editor trên web, đã khai báo sẵn kết nối tới Trino -> http://localhost:8978
  cloudbeaver:
    profiles: ["ui"]
    image: dbeaver/cloudbeaver:24.3.0
    environment:
      JAVA_OPTS: "-Xmx384m"
      # Tự cấu hình server (bỏ qua wizard) + cho phép truy cập ẩn danh vào 2 kết nối Trino khai báo sẵn
      CB_SERVER_NAME: Training Lakehouse
      CB_SERVER_URL: http://localhost:8978
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD:-Lakehouse123}
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./docker/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    ports:
      - "8978:8978"
    depends_on:
      trino: { condition: service_healthy }
    mem_limit: 700m
    networks: [lakehouse-net]

volumes:
  postgres-data:
  cloudbeaver-data:

networks:
  lakehouse-net:
    driver: bridge
